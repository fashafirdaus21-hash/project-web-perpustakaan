<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sistem Informasi Perpustakaan</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 flex items-center justify-center h-screen m-0 font-sans">
    <div class="bg-slate-800 p-8 rounded-2xl shadow-2xl w-96 border border-slate-700">
        <div class="text-center mb-6">
            <span class="text-xs font-bold text-amber-400 tracking-widest uppercase">Sistem Informasi</span>
            <h2 class="text-2xl font-black text-white mt-1">PERPUSTAKAAN</h2>
        </div>
        
        <form action="/login" method="POST" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-300 uppercase mb-1.5">ID Pengguna / NIS / Admin</label>
                <input type="text" name="id_user" required placeholder="Masukkan ID..." class="w-full px-4 py-2.5 rounded-xl bg-slate-900 border border-slate-700 focus:outline-none focus:border-amber-400 text-sm text-white">
            </div>
            
            <div>
                <label class="block text-xs font-semibold text-slate-300 uppercase mb-1.5">Kata Sandi</label>
                <input type="password" name="password" required placeholder="Masukkan password..." class="w-full px-4 py-2.5 rounded-xl bg-slate-900 border border-slate-700 focus:outline-none focus:border-amber-400 text-sm text-white">
            </div>
            
            <button type="submit" class="w-full bg-amber-400 hover:bg-amber-500 text-slate-950 font-bold py-3 rounded-xl transition-all shadow-lg text-sm tracking-wide mt-2">
                Masuk ke Sistem
            </button>
        </form>
    </div>
</body>
</html>
